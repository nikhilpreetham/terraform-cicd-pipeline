
name: Terraform CD

on:
  push:
    branches:
      - main
    paths:
      - 'bootstrap/**'
      - 'environments/dev/**'
      - '.github/workflows/terraform-cd.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev-deployment
  cancel-in-progress: false

jobs:
  terraform-deploy:
    name: Deploy Dev Infrastructure
    runs-on: ubuntu-latest

    environment: dev

    env:
      AWS_REGION: ap-south-1
      TF_IN_AUTOMATION: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Check required repository variables
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ] || [ -z "$TF_STATE_BUCKET" ]; then
            echo "::error::Set the AWS_ROLE_ARN and TF_STATE_BUCKET repository variables (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          mask-aws-account-id: true

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Initialize
        working-directory: environments/dev
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      - name: Terraform Plan
        working-directory: environments/dev
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: environments/dev
        run: terraform apply -input=false -auto-approve tfplan
